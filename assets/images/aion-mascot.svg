<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Aion assistant mascot">
  <style>
    .float{animation:float 4s ease-in-out infinite;transform-origin:center}.orbit{animation:orbit 18s linear infinite;transform-origin:80px 85px}.blink{animation:blink 5s ease-in-out infinite;transform-origin:center}.antenna{animation:sway 5s ease-in-out infinite;transform-origin:80px 38px}@keyframes float{50%{transform:translateY(-5px) rotate(1.5deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}@keyframes sway{50%{transform:rotate(5deg)}}
  </style>
  <defs><radialGradient id="body" cx="35%" cy="28%" r="75%"><stop stop-color="#fff"/><stop offset=".45" stop-color="#f1f1fb"/><stop offset="1" stop-color="#a8a8e0"/></radialGradient><linearGradient id="orbit"><stop stop-color="#8aa4ff" stop-opacity=".05"/><stop offset=".5" stop-color="#d4deff" stop-opacity=".7"/><stop offset="1" stop-color="#8aa4ff" stop-opacity=".05"/></linearGradient></defs>
  <g class="orbit"><ellipse cx="80" cy="86" rx="68" ry="25" fill="none" stroke="url(#orbit)" stroke-width="2" transform="rotate(-18 80 86)"/><circle cx="80" cy="61" r="3" fill="#8aa4ff"/></g>
  <g class="float"><g class="antenna"><path d="M80 52Q80 34 88 23" fill="none" stroke="#c8c8e8" stroke-width="3" stroke-linecap="round"/><path d="M88 23q8-11 10 0-4 8-10 4" fill="#a8b8f0"/></g><circle cx="80" cy="88" r="48" fill="url(#body)" stroke="rgba(255,255,255,.55)"/><ellipse cx="62" cy="63" rx="20" ry="13" fill="#fff" opacity=".4" transform="rotate(-25 62 63)"/>
    <g class="blink"><ellipse cx="62" cy="82" rx="10" ry="13" fill="#17172e"/><ellipse cx="98" cy="82" rx="10" ry="13" fill="#17172e"/><circle cx="59" cy="78" r="4" fill="#fff"/><circle cx="95" cy="78" r="4" fill="#fff"/></g><ellipse cx="50" cy="98" rx="9" ry="5" fill="#8aa4ff" opacity=".25"/><ellipse cx="110" cy="98" rx="9" ry="5" fill="#8aa4ff" opacity=".25"/><path d="M74 106q6 4 12 0" fill="none" stroke="#4a4a5e" stroke-width="2" stroke-linecap="round"/></g>
</svg>
